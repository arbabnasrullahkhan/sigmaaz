    <!-- ==========================================================================
         JAVASCRIPT LOGIC (FIREBASE SYNC + DETERMINISTIC DAILY SEED)
         ========================================================================== -->
    <script>
        const dateOptions = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('en-US', dateOptions);

        const topbar = document.getElementById('islandTopbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) topbar.classList.add('scrolled');
            else topbar.classList.remove('scrolled');
        });

        const DEMO_NAMES = [
            "Ali Raza", "Usman Tariq", "Hassan Ahmed", "Muhammad Bilal", "Hamza Khan",
            "Fahad Mustafa", "Omer Sheikh", "Kamran Akmal", "Zain Abbas", "Saad Haroon",
            "Waqas Mehmood", "Adnan Sami", "Imran Nazir", "Kashif Ali", "Sajid Khan",
            "Tahir Jamil", "Babar Azam", "Shaheen Shah", "Fakhar Zaman", "Rizwan Ali",
            "Asad Shafiq", "Shoaib Malik", "Wahab Riaz", "Yasir Shah", "Azhar Ali",
            "Ayesha Khan", "Fatima Tariq", "Sana Mir", "Nida Dar", "Zara Noor",
            "Hira Mani", "Mahira Khan", "Sajal Aly", "Iqra Aziz", "Yumna Zaidi"
        ];

        function mulberry32(a) {
            return function () {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function generateDailyFallbackLeaderboard() {
            const today = new Date();
            const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
            const random = mulberry32(seed);

            let selectedProfiles = [];
            let availableIndexes = Array.from({ length: DEMO_NAMES.length }, (_, i) => i);

            for (let i = 0; i < 10; i++) {
                const randIndex = Math.floor(random() * availableIndexes.length);
                const nameIndex = availableIndexes[randIndex];
                availableIndexes.splice(randIndex, 1);

                const earnings = Math.floor(random() * 10000) + 2500;

                selectedProfiles.push({
                    name: DEMO_NAMES[nameIndex],
                    initials: DEMO_NAMES[nameIndex].split(' ').map(n => n[0]).join(''),
                    earnings: earnings
                });
            }

            selectedProfiles.sort((a, b) => b.earnings - a.earnings);
            renderLeaderboard(selectedProfiles);
        }

        function formatCurrency(amount) {
            return "Rs. " + Number(amount).toLocaleString('en-PK');
        }

        function renderLeaderboard(profiles) {
            const container = document.getElementById('leaderboardContainer');
            container.innerHTML = '';

            profiles.forEach((profile, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const row = document.createElement('div');
                row.className = `rank-row ${rankClass}`;
                row.style.animationDelay = `${index * 0.04}s`;

                row.innerHTML = `
                    <div class="rank-left">
                        <div class="rank-badge">${rank}</div>
                        <div class="avatar-circle">${profile.initials}</div>
                        <div class="rank-details">
                            <b>${profile.name}</b>
                            <small>Daily Reward</small>
                        </div>
                    </div>
                    <div class="rank-right">
                        <span class="rank-amount font-mono">${formatCurrency(profile.earnings)}</span>
                    </div>
                `;

                container.appendChild(row);
            });
        }

        // Live Firestore Sync with Fallback
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                const db = firebase.firestore();

                // Check if admin has published a leaderboard or if users can be queried
                db.collection('users')
                    .orderBy('totalWithdrawn', 'desc')
                    .limit(10)
                    .get()
                    .then(snapshot => {
                        if (!snapshot.empty && snapshot.size >= 3) {
                            const profiles = [];
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                const name = data.fullName || data.username || 'Investor';
                                const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                                const earnings = Number(data.totalWithdrawn || data.profitBalance || 0);

                                if (earnings > 0) {
                                    profiles.push({ name, initials, earnings });
                                }
                            });

                            if (profiles.length >= 3) {
                                profiles.sort((a, b) => b.earnings - a.earnings);
                                renderLeaderboard(profiles);
                                return;
                            }
                        }
                        generateDailyFallbackLeaderboard();
                    })
                    .catch(() => {
                        generateDailyFallbackLeaderboard();
                    });
            } else {
                generateDailyFallbackLeaderboard();
            }
        });
    </script>
</body>

</html>
