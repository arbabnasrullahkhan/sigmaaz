    <style>
        /* ==========================================================================
           1. SIGMA PREMIUM DESIGN TOKENS
           ========================================================================== */
        :root {
            --sigma-primary: #0B132B;
            --sigma-secondary: #1C2541;

            --sigma-surface: #FFFFFF;
            --sigma-surface-alt: #F8FAFC;
            --sigma-subtle: #F1F5F9;

            --sigma-muted-border: #E2E8F0;
            --sigma-input-border: #CBD5E1;

            --sigma-accent: #10B981;
            --sigma-accent-dark: #059669;
            --sigma-accent-soft: #ECFDF5;
            --sigma-accent-border: #A7F3D0;

            --sigma-gold: #F59E0B;
            --sigma-gold-dark: #D97706;
            --sigma-gold-soft: #FEF3C7;
            --sigma-gold-border: #FDE68A;

            --sigma-danger: #EF4444;
            --sigma-danger-dark: #DC2626;
            --sigma-danger-soft: #FEE2E2;
            --sigma-danger-border: #FECACA;

            --sigma-info: #3B82F6;
            --sigma-info-dark: #2563EB;
            --sigma-info-soft: #EFF6FF;

            --sigma-purple: #8B5CF6;
            --sigma-purple-soft: #F5F3FF;
            --sigma-pink: #F472B6;

            --text-heading: #0F172A;
            --text-body: #334155;
            --text-muted: #64748B;
            --text-light: #94A3B8;

            --radius-pill: 9999px;
            --radius-2xl: 28px;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;

            --shadow-subtle: 0 4px 12px -2px rgba(15, 23, 42, 0.05);
            --shadow-card: 0 16px 32px -8px rgba(15, 23, 42, 0.08);
            --shadow-float: 0 24px 48px -12px rgba(15, 23, 42, 0.15);

            --z-dock: 1000;
            --z-header: 900;
            --z-modal: 2000;
            --z-toast: 3000;

            --transition-smooth: 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --safe-area-bottom: env(safe-area-inset-bottom, 16px);
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE
           ========================================================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--sigma-surface-alt);
            color: var(--text-body);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(110px + var(--safe-area-bottom));
            background-image:
                radial-gradient(circle at 10% 0%, rgba(244, 114, 182, 0.035) 0%, transparent 45vw),
                radial-gradient(circle at 90% 100%, rgba(16, 185, 129, 0.04) 0%, transparent 45vw);
            background-attachment: fixed;
        }

        body.locked {
            overflow: hidden;
            touch-action: none;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input {
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
        }

        button {
            cursor: pointer;
            user-select: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        h1,
        h2,
        h3 {
            color: var(--text-heading);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        #networkOfflineBanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--sigma-danger);
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            padding: 8px;
            z-index: var(--z-toast);
            display: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           3. SINGLE-ROW ISLAND HEADER WITH LOGO & TEXT LOGO
           ========================================================================== */
        .app-container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .island-topbar {
            position: sticky;
            top: 12px;
            margin: 0 16px 20px;
            height: 68px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: var(--z-header);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-smooth);
        }

        .island-topbar.scrolled {
            box-shadow: var(--shadow-card);
            border-color: var(--sigma-muted-border);
            background: rgba(255, 255, 255, 0.98);
        }

        .btn-back {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--sigma-surface);
            color: var(--text-heading);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--sigma-muted-border);
            transition: var(--transition-bounce);
        }

        .btn-back:active {
            transform: scale(0.92);
            background: var(--sigma-subtle);
        }

        .btn-back svg {
            width: 22px;
            height: 22px;
            stroke-width: 2.5;
            stroke: currentColor;
            fill: none;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo-img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
        }

        .brand-text-img {
            height: 20px;
            object-fit: contain;
            margin-top: 2px;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .header-title-box b {
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--sigma-primary);
            line-height: 1.1;
        }

        .header-title-box small {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ==========================================================================
           4. WORKSPACE & FILTER NAVIGATION
           ========================================================================== */
        .workspace {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin: 0 -16px;
            padding-left: 16px;
            padding-right: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            padding: 9px 18px;
            border-radius: var(--radius-pill);
            background: var(--sigma-surface);
            border: 1px solid var(--sigma-muted-border);
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-muted);
            white-space: nowrap;
            transition: var(--transition-bounce);
            box-shadow: var(--shadow-subtle);
            cursor: pointer;
        }

        .filter-pill:active {
            transform: scale(0.95);
        }

        .filter-pill.active {
            background: var(--sigma-primary);
            color: white;
            border-color: var(--sigma-primary);
            box-shadow: 0 6px 16px rgba(11, 19, 43, 0.2);
        }

        /* ==========================================================================
           5. TRANSACTION LIST & RECORD ROWS
           ========================================================================== */
        .island-card {
            background: var(--sigma-surface);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--sigma-muted-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 380px;
        }

        .trx-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--sigma-muted-border);
            transition: var(--transition-smooth);
            cursor: pointer;
            animation: slideUp 0.35s ease-out backwards;
        }

        .trx-row:last-child {
            border-bottom: none;
        }

        .trx-row:active {
            background: var(--sigma-subtle);
            transform: scale(0.99);
        }

        .trx-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .trx-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .trx-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
        }

        .ic-deposit {
            background: var(--sigma-info-soft);
            color: var(--sigma-info-dark);
        }

        .ic-withdraw {
            background: var(--sigma-danger-soft);
            color: var(--sigma-danger-dark);
        }

        .ic-plan {
            background: var(--sigma-purple-soft);
            color: var(--sigma-purple);
        }

        .ic-comm {
            background: var(--sigma-gold-soft);
            color: var(--sigma-gold-dark);
        }

        .ic-bonus {
            background: var(--sigma-accent-soft);
            color: var(--sigma-accent-dark);
        }

        .ic-rejected {
            background: var(--sigma-subtle);
            color: var(--text-muted);
        }

        .trx-details {
            min-width: 0;
        }

        .trx-details b {
            display: block;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-heading);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .trx-details small {
            display: block;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .trx-right {
            text-align: right;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .trx-amount {
            display: block;
            font-size: 1.05rem;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.5px;
            margin-bottom: 3px;
        }

        .amt-plus {
            color: var(--sigma-accent-dark);
        }

        .amt-minus {
            color: var(--text-heading);
        }

        .amt-rejected {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .trx-status {
            display: inline-flex;
            align-items: center;
            padding: 3px 9px;
            border-radius: var(--radius-pill);
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .st-success {
            background: var(--sigma-accent-soft);
            color: var(--sigma-accent-dark);
            border: 1px solid var(--sigma-accent-border);
        }

        .st-pending {
            background: var(--sigma-gold-soft);
            color: var(--sigma-gold-dark);
            border: 1px solid var(--sigma-gold-border);
        }

        .st-rejected {
            background: var(--sigma-danger-soft);
            color: var(--sigma-danger-dark);
            border: 1px solid var(--sigma-danger-border);
        }

        /* Skeletons */
        .skeleton {
            background: #E2E8F0;
            color: transparent !important;
            border-radius: 8px;
            animation: pulseSkel 1.5s infinite ease-in-out;
        }

        .skel-row {
            padding: 18px 20px;
            border-bottom: 1px solid var(--sigma-muted-border);
            display: flex;
            gap: 14px;
        }

        .skel-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .skel-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }

        .skel-line-1 {
            height: 16px;
            width: 60%;
        }

        .skel-line-2 {
            height: 12px;
            width: 40%;
        }

        /* Empty State */
        .empty-state {
            display: none;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .empty-state svg {
            width: 52px;
            height: 52px;
            stroke: var(--sigma-input-border);
            fill: none;
            margin-bottom: 14px;
            stroke-width: 1.5;
        }

        .empty-state b {
            font-size: 1.05rem;
            color: var(--text-heading);
            display: block;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.88rem;
            font-weight: 500;
        }

        /* ==========================================================================
           6. DIGITAL RECEIPT MODAL (ENGLISH ONLY WITH FULL SHARE PROOF)
           ========================================================================== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: var(--z-modal);
            background: rgba(11, 19, 43, 0.65);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .sheet {
            width: 100%;
            max-width: 480px;
            background: var(--sigma-surface);
            border-radius: 32px 32px 0 0;
            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -24px 48px rgba(0, 0, 0, 0.25);
        }

        .overlay.show .sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 48px;
            height: 6px;
            border-radius: 99px;
            background: var(--sigma-input-border);
            margin: 14px auto 10px;
            flex-shrink: 0;
        }

        .sheet-header {
            padding: 8px 24px 18px;
            border-bottom: 1px dashed var(--sigma-muted-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sheet-header h3 {
            font-size: 1.25rem;
            font-weight: 900;
        }

        .btn-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--sigma-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--sigma-muted-border);
            color: var(--text-muted);
            transition: var(--transition-fast);
        }

        .btn-close:active {
            background: var(--sigma-input-border);
            transform: scale(0.9);
        }

        .btn-close svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }

        .sheet-body {
            padding: 24px 24px 34px;
            overflow-y: auto;
            flex: 1;
        }

        .receipt-amount {
            text-align: center;
            margin-bottom: 24px;
        }

        .receipt-amount small {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .receipt-amount b {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--text-heading);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -1px;
        }

        .receipt-status-wrap {
            margin-top: 10px;
        }

        .receipt-list {
            background: var(--sigma-surface-alt);
            border-radius: var(--radius-xl);
            border: 1px solid var(--sigma-muted-border);
            padding: 10px 18px;
            margin-bottom: 20px;
        }

        .receipt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px dashed var(--sigma-input-border);
            font-size: 0.9rem;
        }

        .receipt-item:last-child {
            border-bottom: none;
        }

        .receipt-item span {
            color: var(--text-muted);
            font-weight: 600;
        }

        .receipt-item b {
            color: var(--text-heading);
            font-weight: 800;
            text-align: right;
        }

        .receipt-item b.copyable {
            color: var(--sigma-info-dark);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--sigma-info-soft);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-share-receipt {
            width: 100%;
            background: #25D366;
            color: white;
            border: none;
            padding: 15px;
            border-radius: var(--radius-xl);
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            transition: var(--transition-bounce);
        }

        .btn-share-receipt:active {
            transform: scale(0.96);
        }

        /* ==========================================================================
           7. 3-BUTTON MOBILE DOCK (.html FULL NAVIGATION)
           ========================================================================== */
        .mobile-dock {
            position: fixed;
            bottom: var(--safe-area-bottom);
            left: 50%;
            transform: translateX(-50%);
            height: 76px;
            width: calc(100% - 32px);
            max-width: 440px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: var(--z-dock);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .dock-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-muted);
            width: 64px;
            height: 100%;
            transition: var(--transition-bounce);
            text-decoration: none;
        }

        .dock-slot svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
        }

        .dock-slot span {
            font-size: 0.7rem;
            font-weight: 800;
        }

        .dock-slot.active {
            color: var(--sigma-primary);
        }

        .dock-slot.active svg {
            stroke-width: 2.8;
            transform: translateY(-2px);
            color: var(--sigma-accent-dark);
        }

        .dock-crest-btn {
            position: relative;
            top: -24px;
            width: 68px;
            height: 68px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--sigma-primary), var(--sigma-secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 24px rgba(11, 19, 43, 0.35);
            border: 5px solid var(--sigma-surface-alt);
        }

        .dock-crest-btn:active {
            transform: scale(0.9);
        }

        .dock-crest-btn img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .dock-crest-btn::after {
            content: 'MY PLANS';
            position: absolute;
            bottom: -22px;
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--text-heading);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        @media (min-width: 860px) {
            .mobile-dock {
                display: none;
            }

            body {
                padding-bottom: 40px;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -20px) scale(0.9);
            background: var(--sigma-primary);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: var(--shadow-float);
            z-index: var(--z-toast);
            opacity: 0;
            visibility: hidden;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0) scale(1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseSkel {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }
    </style>
</head>

    <div class="overlay" id="sheetReceipt">

                </div>

                        <b class="copyable" onclick="TransactionController.copyTrxId()" id="rcId">

                <button class="btn-share-receipt" onclick="TransactionController.shareOnWhatsApp()">

    <!-- Notification Toast -->
    <div class="toast" id="toastBox">
        <svg style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;">
            <use href="#icon-check"></use>
        </svg>
        <span id="toastMsg">Action successful</span>
    </div>

    <!-- ==========================================================================
         JAVASCRIPT CONTROLLER (IMMUTABLE FIRESTORE AUDIT TRAIL)
         ========================================================================== -->
    <script>
        const TransactionController = (() => {

            let authUser = null;
            let transactionsList = [];
            let currentFilter = 'all';
            let unsubscribeListener = null;

            const dom = {
                listContainer: document.getElementById('trxListContainer'),
                emptyState: document.getElementById('emptyState'),
                filterNav: document.getElementById('filterNav'),
                toastBox: document.getElementById('toastBox'),
                toastMsg: document.getElementById('toastMsg'),

                rcTitle: document.getElementById('rcTitle'),
                rcAmount: document.getElementById('rcAmount'),
                rcStatusBadge: document.getElementById('rcStatusBadge'),
                rcId: document.getElementById('rcId'),
                rcDate: document.getElementById('rcDate'),
                rcFee: document.getElementById('rcFee'),
                rcNet: document.getElementById('rcNet')
            };

            const haptic = (ms = 20) => {
                try {
                    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
                    if (navigator.vibrate) navigator.vibrate(ms);
                } catch (e) { }
            };

            const toast = (msg, isError = false) => {
                dom.toastMsg.textContent = msg;
                dom.toastBox.className = `toast show ${isError ? 'error' : ''}`;
                haptic(isError ? 50 : 25);
                setTimeout(() => dom.toastBox.classList.remove('show'), 3000);
            };

            const openSheet = (id) => {
                document.getElementById(id).classList.add('show');
                document.body.classList.add('locked');
                haptic(15);
            };

            const closeSheet = (id) => {
                document.getElementById(id).classList.remove('show');
                document.body.classList.remove('locked');
            };

            const copyTrxId = async () => {
                const rawText = dom.rcId.textContent.trim().replace('Copy', '');
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(rawText);
                    } else {
                        const temp = document.createElement('textarea');
                        temp.value = rawText; document.body.appendChild(temp);
                        temp.select(); document.execCommand('copy'); document.body.removeChild(temp);
                    }
                    toast('Reference ID copied securely');
                } catch (err) {
                    toast('Failed to copy text', true);
                }
            };

            const shareOnWhatsApp = () => {
                const title = dom.rcTitle.textContent.trim();
                const amt = dom.rcAmount.textContent.trim();
                const status = dom.rcStatusBadge.textContent.trim().toUpperCase();
                const ref = dom.rcId.textContent.replace('Copy', '').trim();
                const date = dom.rcDate.textContent.trim();

                const emoji = status === 'VERIFIED' ? '✅' : status === 'PENDING' ? '⏳' : '❌';
                const msg = `${emoji} *Payment ${status}* ${emoji}\n\n*Amount:* ${amt}\n*Type:* ${title}\n*Reference:* ${ref}\n*Date:* ${date}\n\nProcessed securely via Sigma.`;

                if (navigator.share && /mobile|android|iphone/i.test(navigator.userAgent)) {
                    navigator.share({
                        title: 'Sigma Digital Slip',
                        text: msg
                    }).catch(console.error);
                } else {
                    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
                    window.open(url, '_blank');
                }
            };

            const mapTransactionType = (type) => {
                const t = (type || '').toLowerCase();
                let iconClass = 'ic-plan';
                let iconSvg = '#icon-layers';
                let sign = '';
                let isPositive = false;
                let titlePrefix = t.replace(/_/g, ' ').toUpperCase();

                if (t === 'deposit') {
                    iconClass = 'ic-deposit'; iconSvg = '#icon-arrow-down'; sign = '+'; isPositive = true; titlePrefix = 'Deposit Fund';
                } else if (t === 'welcome_bonus') {
                    iconClass = 'ic-deposit'; iconSvg = '#icon-gift'; sign = '+'; isPositive = true; titlePrefix = 'Welcome Credit';
                } else if (t === 'withdraw' || t === 'withdrawal') {
                    iconClass = 'ic-withdraw'; iconSvg = '#icon-arrow-up'; sign = '-'; isPositive = false; titlePrefix = 'Withdrawal Payout';
                } else if (t === 'plan') {
                    iconClass = 'ic-plan'; iconSvg = '#icon-layers'; sign = '-'; isPositive = false; titlePrefix = 'Portfolio Subscription';
                } else if (t === 'commission') {
                    iconClass = 'ic-comm'; iconSvg = '#icon-gift'; sign = '+'; isPositive = true; titlePrefix = 'Referral Commission';
                } else if (t === 'profit' || t === 'roi') {
                    iconClass = 'ic-bonus'; iconSvg = '#icon-arrow-down'; sign = '+'; isPositive = true; titlePrefix = 'Daily ROI Yield';
                }

                return { iconClass, iconSvg, sign, isPositive, titlePrefix };
            };

            const openReceipt = (tx) => {
                const uiMap = mapTransactionType(tx.type);

                dom.rcTitle.textContent = tx.description || uiMap.titlePrefix;

                const st = (tx.status || 'verified').toLowerCase();
                dom.rcStatusBadge.textContent = st;
                dom.rcStatusBadge.className = 'trx-status';
                let amtColor = 'var(--text-heading)';

                if (st === 'rejected' || st === 'failed') {
                    dom.rcStatusBadge.classList.add('st-rejected');
                    amtColor = 'var(--text-muted)';
                    uiMap.sign = '';
                } else if (st === 'pending' || st === 'processing') {
                    dom.rcStatusBadge.classList.add('st-pending');
                } else {
                    dom.rcStatusBadge.classList.add('st-success');
                    if (uiMap.isPositive) amtColor = 'var(--sigma-accent-dark)';
                }

                const baseAmt = Number(tx.amount || 0);
                const feeAmt = Number(tx.fee || 0);
                const netAmt = baseAmt - feeAmt;

                dom.rcAmount.textContent = `${uiMap.sign}${baseAmt.toLocaleString('en-PK')} PKR`;
                dom.rcAmount.style.color = amtColor;

                dom.rcFee.textContent = `${feeAmt.toLocaleString('en-PK')} PKR`;
                dom.rcNet.textContent = `${uiMap.sign}${netAmt.toLocaleString('en-PK')} PKR`;

                dom.rcId.innerHTML = `${tx.referenceId || 'N/A'} <svg style="width:14px;height:14px;"><use href="#icon-copy"></use></svg>`;

                let dateStr = 'Recent';
                if (tx.createdAt) {
                    const d = new Date(tx.createdAt.seconds ? tx.createdAt.seconds * 1000 : tx.createdAt);
                    dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' • ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
                dom.rcDate.textContent = dateStr;

                openSheet('sheetReceipt');
            };

            const renderTransactions = () => {
                if (!dom.listContainer) return;

                const filtered = transactionsList.filter(tx => {
                    const t = (tx.type || '').toLowerCase();
                    if (currentFilter === 'all') return true;
                    if (currentFilter === 'deposit') return (t === 'deposit' || t === 'welcome_bonus');
                    if (currentFilter === 'withdraw') return (t === 'withdraw' || t === 'withdrawal');
                    if (currentFilter === 'profit') return (t === 'profit' || t === 'roi');
                    if (currentFilter === 'commission') return (t === 'commission');
                    if (currentFilter === 'plan') return (t === 'plan');
                    return t === currentFilter;
                });

                if (filtered.length === 0) {
                    dom.listContainer.style.display = 'none';
                    dom.emptyState.style.display = 'flex';
                    return;
                }

                dom.emptyState.style.display = 'none';
                dom.listContainer.style.display = 'flex';
                dom.listContainer.innerHTML = '';

                filtered.forEach((tx, idx) => {
                    const uiMap = mapTransactionType(tx.type);
                    const st = (tx.status || 'verified').toLowerCase();

                    let statusBadgeClass = 'st-success';
                    let amtClass = uiMap.isPositive ? 'amt-plus' : 'amt-minus';

                    if (st === 'rejected' || st === 'failed') {
                        statusBadgeClass = 'st-rejected';
                        amtClass = 'amt-rejected';
                        uiMap.iconClass = 'ic-rejected';
                        uiMap.sign = '';
                    } else if (st === 'pending' || st === 'processing') {
                        statusBadgeClass = 'st-pending';
                    }

                    const dateStr = tx.createdAt ? new Date(tx.createdAt.seconds ? tx.createdAt.seconds * 1000 : tx.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'Today';

                    const row = document.createElement('div');
                    row.className = 'trx-row';
                    row.style.animationDelay = `${idx * 0.04}s`;
                    row.onclick = () => openReceipt(tx);

                    row.innerHTML = `
                        <div class="trx-left">
                            <div class="trx-icon ${uiMap.iconClass}"><svg><use href="${uiMap.iconSvg}"></use></svg></div>
                            <div class="trx-details">
                                <b>${tx.description || uiMap.titlePrefix}</b>
                                <small>${dateStr} • Ref: ${tx.referenceId || 'N/A'}</small>
                            </div>
                        </div>
                        <div class="trx-right">
                            <span class="trx-amount ${amtClass}">${uiMap.sign}${Number(tx.amount || 0).toLocaleString('en-PK')}</span>
                            <span class="trx-status ${statusBadgeClass}">${st}</span>
                        </div>
                    `;
                    dom.listContainer.appendChild(row);
                });
            };

            const bindFilters = () => {
                if (!dom.filterNav) return;
                const pills = dom.filterNav.querySelectorAll('.filter-pill');
                pills.forEach(pill => {
                    pill.addEventListener('click', (e) => {
                        pills.forEach(p => p.classList.remove('active'));
                        e.target.classList.add('active');
                        currentFilter = e.target.getAttribute('data-filter');
                        haptic(15);
                        renderTransactions();
                    });
                });
            };

            const initFirebase = () => {
                if (typeof firebase === 'undefined' || !firebase.apps.length) return;

                const auth = firebase.auth();
                const db = firebase.firestore();

                auth.onAuthStateChanged(user => {
                    if (!user) { window.location.replace('login.html'); return; }
                    authUser = user;

                    if (user.photoURL) {
                        const dockAvatar = document.getElementById('dockAvatarContainer');
                        if (dockAvatar) dockAvatar.innerHTML = `<img src="${user.photoURL}" alt="User" style="width:100%;height:100%;object-fit:cover;" referrerpolicy="no-referrer">`;
                    }

                    unsubscribeListener = db.collection('users').doc(user.uid).collection('transactions')
                        .orderBy('createdAt', 'desc')
                        .limit(50)
                        .onSnapshot(snapshot => {
                            transactionsList = [];
                            snapshot.forEach(doc => {
                                transactionsList.push({ id: doc.id, ...doc.data() });
                            });
                            renderTransactions();
                        }, error => {
                            console.error("Ledger error:", error);
                            if (dom.listContainer) dom.listContainer.innerHTML = `<div style="padding:40px; text-align:center; color: var(--sigma-danger);">Unable to securely fetch ledger.</div>`;
                        });
                });
            };

            const init = () => {
                const header = document.getElementById('topHeader');
                if (header) {
                    window.addEventListener('scroll', () => {
                        if (window.scrollY > 20) header.classList.add('scrolled');
                        else header.classList.remove('scrolled');
                    }, { passive: true });
                }

                document.querySelectorAll('.overlay').forEach(ov => {
                    ov.addEventListener('click', e => { if (e.target === ov) closeSheet(ov.id); });
                });

                bindFilters();
                initFirebase();
            };

            return { init, closeSheet, copyTrxId, shareOnWhatsApp };
        })();

        document.addEventListener('DOMContentLoaded', TransactionController.init);
    </script>
</body>

</html>
